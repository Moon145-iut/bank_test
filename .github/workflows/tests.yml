name: ParaBank Selenium Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests in headless Chrome
        run: >-
          mvn --batch-mode clean test
          -Dheadless=true
          -Dparabank.username=${{ secrets.PARABANK_USERNAME }}
          -Dparabank.password=${{ secrets.PARABANK_PASSWORD }}
          -Dparabank.payeeAccount=${{ secrets.PARABANK_PAYEE_ACCOUNT }}

      - name: Add report landing page
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          cat > reports/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>ParaBank Test Report</title></head>
          <body><h1>ParaBank Selenium Test Report</h1>
          <p><a href="ExtentReport.html">Open the latest Extent report</a></p>
          </body></html>
          EOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parabank-test-reports
          path: reports/
          if-no-files-found: warn

      - name: Prepare GitHub Pages report
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  deploy-report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Extent report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
